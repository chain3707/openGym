# Publishes the personal, browser-only build to this fork's GitHub Pages site.
#
# Pages serves static files only, so this build has no backend. VITE_PERSONAL=1
# starts an empty local profile without sign-in or sync.
# The exercise stills and animations (180 px) come from catalogue/media and are staged next to
# the build by scripts/catalogue/stage-media.mjs, so the demo serves them from its own origin.
name: Deploy personal openGym to GitHub Pages

on:
  push:
    branches: [main, ios-personal-pwa]
    paths:
      - 'frontend/**'
      - 'catalogue/**'
      - 'scripts/catalogue/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test -- src/views/Login.device-link.test.jsx src/views/Login.password.test.jsx src/views/CoachChat.demo-failure.test.jsx src/views/Plan.rotation.test.jsx src/components/SyncBanner.test.jsx src/lib/coach-api.i18n.test.js
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_PERSONAL: '1'
      # The 180 px stills and animations from catalogue/media, served next to the demo
      - run: node scripts/catalogue/stage-media.mjs frontend/dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
